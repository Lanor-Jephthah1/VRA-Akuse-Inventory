<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sign In | Volta River Authority • Akuse Inventory</title>

  <!-- OpenGraph / WhatsApp Link Preview Metadata -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vra-akuse-inventory.vercel.app" />
  <meta property="og:title" content="VRA Akuse Stores &amp; Inventory Management System" />
  <meta property="og:description" content="Volta River Authority • Kpong Generating Station, Akuse. Departmental stores, requisitions (SIV/SRV), and asset management portal." />
  <meta property="og:image" content="https://vra-akuse-inventory.vercel.app/static/vra_logo.png" />
  <meta property="og:image:secure_url" content="https://vra-akuse-inventory.vercel.app/static/vra_logo.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="315" />
  <meta property="og:site_name" content="Volta River Authority" />

  <!-- Twitter / WhatsApp Fallback Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VRA Akuse Stores &amp; Inventory Management System" />
  <meta name="twitter:description" content="Volta River Authority • Kpong Generating Station, Akuse. Departmental stores, requisitions (SIV/SRV), and asset management portal." />
  <meta name="twitter:image" content="https://vra-akuse-inventory.vercel.app/static/vra_logo.png" />

  <link rel="icon" type="image/png" href="/static/vra_logo.png" />
  <script src="/static/js/tailwind.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body data-login-mode="{{ mode or 'STAFF' }}" class="min-h-screen w-full max-w-full bg-slate-100 text-slate-900 flex flex-col justify-center items-center px-3 sm:px-4 py-6 sm:py-8 overflow-x-hidden antialiased selection:bg-[#00529B] selection:text-white">

  <div class="w-full max-w-[400px] mx-auto animate-page">
    
    <!-- Centered Authority Brand Header -->
    <div class="text-center mb-5">
      <div class="inline-flex items-center justify-center bg-white border border-slate-200 rounded-xl p-3 shadow-xs mb-3">
        <img src="/static/vra_logo.png" alt="Volta River Authority" class="h-11 w-auto object-contain" />
      </div>
      <h1 class="text-base font-bold text-slate-900 tracking-tight">Volta River Authority</h1>
    </div>

    <!-- Centered Card -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-[0_2px_12px_rgba(15,23,42,0.04)] p-5 sm:p-7">
      
      <!-- Staff vs Supervisor Switcher -->
      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-lg border border-slate-200/90 mb-5">
        <button
          type="button"
          id="tabStaff"
          onclick="setLoginMode('STAFF')"
          class="h-8 rounded-md text-xs font-medium transition-all"
        >
          Staff Account
        </button>
        <button
          type="button"
          id="tabSupervisor"
          onclick="setLoginMode('SUPERVISOR')"
          class="h-8 rounded-md text-xs font-medium transition-all"
        >
          Supervisor / Store
        </button>
      </div>

      {% if error %}
      <div class="mb-5 rounded-md bg-rose-50 border border-rose-200 p-3 text-xs text-rose-800 flex items-start gap-2.5">
        <svg class="w-4 h-4 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <div class="leading-relaxed">{{ error }}</div>
      </div>
      {% endif %}

      <form action="/login" method="post" class="space-y-4" id="loginForm">
        <input type="hidden" name="login_mode" id="loginModeInput" value="{{ mode or 'STAFF' }}" />

        <div>
          <label for="identifierInput" id="identifierLabel" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Staff ID or Official Email
          </label>
          <input
            type="text"
            name="identifier"
            id="identifierInput"
            required
            autofocus
            placeholder="e.g. VRA-AK-3041"
            class="w-full h-9 rounded-md border border-slate-300 bg-white px-3 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00529B]/15 focus:border-[#00529B] transition-all"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="passwordInput" class="block text-xs font-semibold text-slate-700">
              Password
            </label>
            <span class="text-[11px] text-slate-400">Default: vra123</span>
          </div>
          <input
            type="password"
            name="password"
            id="passwordInput"
            required
            placeholder="Enter account password"
            class="w-full h-9 rounded-md border border-slate-300 bg-white px-3 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00529B]/15 focus:border-[#00529B] transition-all"
          />
        </div>

        <div class="pt-1 flex items-center justify-between">
          <button
            type="submit"
            id="submitBtn"
            class="h-8 px-5 bg-[#00529B] hover:bg-[#003d75] active:scale-[0.99] text-white font-semibold text-xs rounded-md shadow-xs transition-all flex items-center justify-center gap-1.5"
          >
            <span>Sign In</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </div>
      </form>

      <!-- Filtered Quick Demo Selector -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-[11px] font-medium text-slate-500">
            Inspection &amp; Demo Account Switcher
          </label>
          <span class="text-[10px] text-slate-400 font-mono">Password: vra123</span>
        </div>
        <select
          id="quickDemoSelect"
          onchange="if(this.value) fillLogin(this.value)"
          class="w-full h-8 rounded-md border border-slate-200 bg-slate-50 px-2.5 text-xs text-slate-600"
        >
          <option value="">Select account to sign in...</option>
        </select>
      </div>

    </div>

    <!-- Below Login Card: Operational Unit & Legal Notice -->
    <div class="text-center mt-5 space-y-1">
      <p class="text-xs font-semibold text-slate-700 tracking-tight">Kpong Generating Station, Akuse &bull; Stores &amp; Inventory Portal</p>
      <p class="text-[11px] text-slate-400">Official Departmental Stores &bull; Akuse Operational Base</p>
    </div>

  </div>

  <script id="demoAccountsData" type="application/json">{{ demo_accounts_json | safe }}</script>
  <script src="/static/js/login.js"></script>
</body>
</html>
